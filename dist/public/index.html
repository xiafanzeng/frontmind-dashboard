  <body>
    <div id="root"></div>
    <!-- Analytics: only loaded when VITE_ANALYTICS_ENDPOINT is configured -->
    <script>
      (function() {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        // Only load analytics if the env vars were actually replaced by Vite
        if (endpoint && !endpoint.includes('VITE_ANALYTICS') && websiteId && !websiteId.includes('VITE_ANALYTICS')) {
          var s = document.createElement('script');
          s.defer = true;
          s.src = endpoint + '/umami';
          s.setAttribute('data-website-id', websiteId);
          document.head.appendChild(s);
        }
      })();
    </script>
  </body>
