<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>FrontMind Dashboard</title>
    <style id="frontmind-boot-style">
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f7f6f9;
        color: #292331;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .frontmind-boot-shell {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .frontmind-boot-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #e7e1eb;
        border-radius: 18px;
        box-shadow: 0 18px 52px rgba(51, 33, 61, 0.1);
        max-width: 420px;
        padding: 32px;
        text-align: center;
        width: 100%;
      }

      .frontmind-boot-mark {
        align-items: center;
        background: #f1e9f7;
        border-radius: 14px;
        color: #641b96;
        display: inline-flex;
        font-size: 20px;
        font-weight: 700;
        height: 48px;
        justify-content: center;
        width: 48px;
      }

      .frontmind-boot-title {
        font-size: 18px;
        font-weight: 650;
        margin: 18px 0 0;
      }

      .frontmind-boot-message {
        color: #706779;
        font-size: 14px;
        line-height: 1.65;
        margin: 10px 0 0;
      }

      .frontmind-boot-reload {
        background: #641b96;
        border: 0;
        border-radius: 9px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        margin-top: 20px;
        padding: 10px 18px;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main
        id="frontmind-boot-shell"
        class="frontmind-boot-shell"
        role="status"
        aria-live="polite"
      >
        <section
          class="frontmind-boot-card"
          aria-labelledby="frontmind-boot-title"
        >
          <div class="frontmind-boot-mark" aria-hidden="true">F</div>
          <h1 id="frontmind-boot-title" class="frontmind-boot-title">
            正在打开 FrontMind 工作空间
          </h1>
          <p id="frontmind-boot-message" class="frontmind-boot-message">
            正在安全加载页面资源，请稍候。
          </p>
          <button
            id="frontmind-boot-reload"
            class="frontmind-boot-reload"
            type="button"
            hidden
          >
            刷新重试
          </button>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const shell = document.getElementById("frontmind-boot-shell");
        const message = document.getElementById("frontmind-boot-message");
        const reload = document.getElementById("frontmind-boot-reload");
        let booted = false;

        const showFailure = () => {
          if (booted || !shell || !message || !reload) return;
          shell.setAttribute("role", "alert");
          message.textContent =
            "页面资源未能正常启动。请检查网络后刷新；若仍失败，请联系管理员。";
          reload.hidden = false;
        };

        const watchdog = window.setTimeout(showFailure, 10_000);
        window.addEventListener(
          "frontmind:booted",
          () => {
            booted = true;
            window.clearTimeout(watchdog);
          },
          { once: true },
        );
        window.addEventListener(
          "error",
          () => {
            if (!booted) showFailure();
          },
          true,
        );
        reload?.addEventListener("click", () => window.location.reload());
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>FrontMind 需要启用 JavaScript 才能打开工作空间。</noscript>
  </body>
</html>
